<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#102b20"><meta name="description" content="GOBSHITE! — a cheeky Irish pixel-art arcade runner."><title>GOBSHITE! — One tiny Irish troublemaker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
:root{--green:#174d35;--lime:#b8ef54;--orange:#ff9b42;--cream:#fff0c9;--ink:#14251c}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102b20;color:var(--cream);font-family:'Press Start 2P',monospace;touch-action:none}button{font:inherit;cursor:pointer;border:3px solid #10251b;border-radius:8px;color:#14251c;background:var(--lime);box-shadow:0 5px 0 #0a1a12, inset 0 2px #e7ffb4;padding:14px 12px;font-size:12px}button:active{transform:translateY(3px);box-shadow:0 2px 0 #0a1a12}#wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 25%,#2e7650,#102b20 75%)}canvas{display:block;width:100%;height:100%;max-width:600px;object-fit:contain;image-rendering:pixelated}#hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:0;right:0;display:none;justify-content:space-between;padding:0 14px;pointer-events:none;font-size:10px;text-shadow:2px 2px #10251b}#hud button{pointer-events:auto;padding:9px;font-size:10px}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:linear-gradient(#071a1277,#071a12bb)}.panel{width:min(100%,420px);border:4px solid #15271d;background:#f7e6b7;color:var(--ink);box-shadow:0 0 0 4px #e0a24e,8px 8px 0 #071a12;padding:22px 18px;text-align:center}.logo{font-size:clamp(27px,8vw,48px);line-height:1.25;letter-spacing:-3px;color:var(--lime);text-shadow:3px 3px #174d35,6px 6px #10251b,-1px -1px #10251b}.logo span{color:var(--orange)}.tag{font-size:9px;line-height:2.1;margin:17px auto;color:#33513c}.hero{font-size:70px;line-height:1.3;filter:drop-shadow(4px 5px 0 #b77a37);margin:10px}.controls{font-size:8px;line-height:2.2;margin:16px 0}.actions{display:grid;gap:12px;margin-top:18px}.small{font-size:8px;line-height:2;color:#425543;margin-top:16px}.hidden{display:none!important}.speech{font-size:11px;line-height:1.8;margin:14px 0 18px}.stats{font-size:9px;line-height:2.4;margin:10px 0}.sound{background:#e9d5a2}.mobile-hint{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:8px;color:#fff0c9cc;pointer-events:none}@media(min-aspect-ratio:3/4){canvas{height:100%;width:auto;max-width:100vw}#overlay{padding:12px}.panel{padding:14px;max-width:360px}.hero{font-size:48px}.tag{margin:8px}.controls{margin:8px}}
</style></head>
<body><main id="wrap"><canvas id="game" aria-label="GOBSHITE arcade game"></canvas>
<div id="hud"><div>DISTANCE <span id="score">0</span>m<br><span style="color:#b8ef54">BEST <span id="best">0</span>m</span></div><button id="pauseBtn" aria-label="Pause">Ⅱ</button></div>
<div id="overlay"><section class="panel" id="panel"><div class="logo">GOB<span>SHITE!</span></div><div class="hero">🧝</div><div class="tag">ONE TINY IRISH TROUBLEMAKER.<br>ONE VERY BAD DAY.<br>YOUR FAULT, APPARENTLY.</div><div class="controls">SWIPE ← → CHANGE TRACK<br>SWIPE ↑ JUMP · SWIPE ↓ DUCK</div><div class="actions"><button id="playBtn">▶ PLAY</button><button class="sound" id="soundBtn">♫ SOUND: OFF</button></div><div class="small">NO DOWNLOAD. NO MERCY. JUST ONE MORE GO.</div></section></div>
<div class="mobile-hint" id="hint">SWIPE TO DODGE · TAP TO START</div></main>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const overlay=document.getElementById('overlay'),panel=document.getElementById('panel'),hud=document.getElementById('hud'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),hint=document.getElementById('hint');
let W=390,H=844,dpr=1,state='title',last=0,elapsed=0,distance=0,best=Number(localStorage.getItem('gobshite-best')||0),speed=210,lane=1,playerY=0,jump=0,duck=0,obstacles=[],spawnIn=1.1,particles=[],sound=false,audio=null,dialogue='',hitType='barrier',shake=0,nearMissAt=0;
bestEl.textContent=best;
function resize(){dpr=Math.min(devicePixelRatio||1,2);const r=canvas.getBoundingClientRect();W=Math.max(300,r.width);H=Math.max(500,r.height);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(resize).observe(canvas);resize();
function beep(freq=300,dur=.08,type='square'){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.value=.035;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.stop(audio.currentTime+dur)}catch{}}
function rnd(a,b){return a+Math.random()*(b-a)}
function start(){state='run';elapsed=0;distance=0;speed=205;lane=1;jump=duck=0;obstacles=[];particles=[];spawnIn=.7;dialogue='';overlay.classList.add('hidden');hud.style.display='flex';hint.textContent='';last=performance.now();beep(540,.08)}
const lines={barrier:['Ah, grand. A head like a turnip.','Were you looking at the scenery, ya gobshite?','That sign was taller than your brain.'],sheep:["You couldn't avoid a sheep? A SHEEP!",'He has more sense than you, that sheep.','I blame the sheep. And somehow, still you.'],bridge:['Brilliant. Absolutely brilliant.','Mind the head? What head?','A grand day to become a pancake.'],train:['Were you trying to get yourself turned into a tin of beans?','Next time, try NOT meeting the train.','I specifically ordered the small train.'],rock:['Rock. You. See rock. You hit rock. Jaysus.','A mighty plan. A terrible brain.'],log:['Timber! No, wait. That was you.','You jumped like a wet sock.']};
function crash(o){if(state!=='run')return;state='crash';hitType=o.type;dialogue=(lines[o.type]||lines.barrier)[Math.floor(Math.random()*(lines[o.type]||lines.barrier).length)];shake=12;beep(100,.22,'sawtooth');for(let i=0;i<18;i++)particles.push({x:W/2+rnd(-30,30),y:H*.67,vx:rnd(-130,130),vy:rnd(-220,40),life:rnd(.35,.8),c:i%2?'#ff9b42':'#fff0c9'});if(Math.floor(distance)>best){best=Math.floor(distance);localStorage.setItem('gobshite-best',best);bestEl.textContent=best}setTimeout(()=>{if(state==='crash')showGameOver()},650)}
function showGameOver(){overlay.classList.remove('hidden');panel.innerHTML=`<div class="logo">OHHH <span>GOBSHITE!</span></div><div class="hero" style="font-size:58px">🤕</div><div class="speech">“${dialogue}”</div><div class="stats">DISTANCE: ${Math.floor(distance)}m<br>PERSONAL BEST: ${best}m</div><div class="actions"><button id="againBtn">↻ TRY AGAIN</button><button class="sound" id="homeBtn">TITLE SCREEN</button></div><div class="small">GO ON. I'LL GIVE YA ANOTHER CHANCE.</div>`;document.getElementById('againBtn').onclick=start;document.getElementById('homeBtn').onclick=title}
function title(){state='title';hud.style.display='none';hint.textContent='SWIPE TO DODGE · TAP TO START';panel.innerHTML=`<div class="logo">GOB<span>SHITE!</span></div><div class="hero">🧝</div><div class="tag">ONE TINY IRISH TROUBLEMAKER.<br>ONE VERY BAD DAY.<br>YOUR FAULT, APPARENTLY.</div><div class="controls">SWIPE ← → CHANGE TRACK<br>SWIPE ↑ JUMP · SWIPE ↓ DUCK</div><div class="actions"><button id="playBtn">▶ PLAY</button><button class="sound" id="soundBtn">♫ SOUND: ${sound?'ON':'OFF'}</button></div><div class="small">BEST DISTANCE: ${best}m<br>NO DOWNLOAD. NO MERCY. JUST ONE MORE GO.</div>`;document.getElementById('playBtn').onclick=start;document.getElementById('soundBtn').onclick=toggleSound;overlay.classList.remove('hidden')}
function toggleSound(){sound=!sound;const b=document.getElementById('soundBtn');if(b)b.textContent='♫ SOUND: '+(sound?'ON':'OFF');beep(440,.07)}document.getElementById('playBtn').onclick=start;document.getElementById('soundBtn').onclick=toggleSound;
function spawn(){let type;const r=Math.random();if(elapsed>18&&r<.13)type='train';else if(r<.24)type='sheep';else if(r<.43)type='barrier';else if(r<.60)type='bridge';else if(r<.75)type='rock';else type='log';let ln=Math.floor(Math.random()*3);obstacles.push({type,lane:ln,y:-50,done:false,passed:false,w:type==='train'?62:48,h:type==='bridge'?44:40});if(type==='train')obstacles[obstacles.length-1].lane=lane===1?(Math.random()<.5?0:2):1}
function move(action){if(state!=='run')return;if(action==='left')lane=Math.max(0,lane-1);if(action==='right')lane=Math.min(2,lane+1);if(action==='jump'&&jump<=0&&duck<=0){jump=.62;beep(520,.06)}if(action==='duck'&&jump<=0){duck=.58;beep(220,.05)}}
let sx=0,sy=0;canvas.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});canvas.addEventListener('pointerup',e=>{if(state==='title'){start();return}if(state!=='run')return;let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;if(Math.abs(dx)>Math.abs(dy))move(dx<0?'left':'right');else move(dy<0?'jump':'duck')});window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Escape'].includes(e.key))e.preventDefault();if(state==='title'&&(e.key===' '||e.key==='Enter'))start();else if(e.key==='ArrowLeft'||e.key==='a')move('left');else if(e.key==='ArrowRight'||e.key==='d')move('right');else if(e.key==='ArrowUp'||e.key==='w')move('jump');else if(e.key==='ArrowDown'||e.key==='s')move('duck');else if(e.key==='Escape'&&state==='run')pause()});
function pause(){if(state==='run'){state='pause';panel.innerHTML=`<div class="logo">TAKE A <span>BREATHER</span></div><div class="hero">😏</div><div class="actions"><button id="resumeBtn">RESUME</button><button class="sound" id="restartBtn">RESTART RUN</button><button class="sound" id="quitBtn">TITLE SCREEN</button></div>`;overlay.classList.remove('hidden');document.getElementById('resumeBtn').onclick=()=>{state='run';overlay.classList.add('hidden');last=performance.now()};document.getElementById('restartBtn').onclick=start;document.getElementById('quitBtn').onclick=title}}
document.getElementById('pauseBtn').onclick=pause;
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function text(t,x,y,size,color='#fff0c9',align='center'){ctx.font=`${size}px "Press Start 2P", monospace`;ctx.textAlign=align;ctx.fillStyle='#10251b';ctx.fillText(t,x+2,y+3);ctx.fillStyle=color;ctx.fillText(t,x,y)}
function drawBg(t){rect(0,0,W,H,'#83d5ed'); // sky
// clouds
for(let i=0;i<5;i++){let x=((i*137-t*9)%(W+100)+W+100)%(W+100)-50,y=60+(i%3)*38;rect(x,y,46,12,'#fff0d0');rect(x+9,y-8,25,12,'#fff0d0')}
// hills
ctx.fillStyle='#65b85a';ctx.beginPath();ctx.moveTo(0,H*.34);for(let x=0;x<=W;x+=8)ctx.lineTo(x,H*.28+Math.sin(x*.018+t*.0003)*25+Math.sin(x*.041)*10);ctx.lineTo(W,H*.6);ctx.lineTo(0,H*.6);ctx.fill();ctx.fillStyle='#2e8049';ctx.beginPath();ctx.moveTo(0,H*.43);for(let x=0;x<=W;x+=8)ctx.lineTo(x,H*.38+Math.sin(x*.013+t*.0002+2)*30);ctx.lineTo(W,H*.65);ctx.lineTo(0,H*.65);ctx.fill();
// castle
rect(W*.73,H*.19,34,65,'#a5a58b');rect(W*.77,H*.14,13,30,'#8b907c');rect(W*.74,H*.17,7,12,'#8b907c');rect(W*.79,H*.23,6,10,'#52695d');
// track bed perspective
ctx.fillStyle='#8d7652';ctx.beginPath();ctx.moveTo(W*.32,H*.34);ctx.lineTo(W*.68,H*.34);ctx.lineTo(W*1.15,H);ctx.lineTo(-W*.15,H);ctx.fill();ctx.strokeStyle='#d7bd84';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(W*.42,H*.34);ctx.lineTo(W*.20,H);ctx.moveTo(W*.58,H*.34);ctx.lineTo(W*.80,H);ctx.stroke();
// sleepers
for(let i=0;i<15;i++){let p=((i/15+(t*.00028))%1);let y=H*.34+p*p*H*.66;let half=5+p*W*.48;rect(W/2-half,y,half*2,3+p*7,'#6c442d')}
// lane guides
ctx.strokeStyle='#ead4a0aa';ctx.lineWidth=2;ctx.setLineDash([8,12]);ctx.beginPath();ctx.moveTo(W*.5,H*.36);ctx.lineTo(W*.5,H);ctx.stroke();ctx.setLineDash([]);
// stone walls and flowers
for(let i=0;i<13;i++){let p=((i/13+t*.00023)%1),y=H*.42+p*p*H*.55,scale=.3+p;rect(W*.04,y,22*scale,5*scale,'#718b6c');rect(W*.84,y,24*scale,5*scale,'#718b6c');if(i%3===0){rect(W*.12+Math.sin(i)*8,y-4*scale,3*scale,3*scale,'#ffcc68');rect(W*.89,y-3*scale,3*scale,3*scale,'#f4a6a2')}}}
function drawHero(t){let x=W*(.25+.25*lane),base=H*.73-jump*H*.42,scale=Math.min(W/390,1.2);if(duck>0)base+=15;let bob=Math.sin(t*.018)*3;ctx.save();ctx.translate(x,base+bob);if(duck>0)ctx.scale(1.25,.58); // cart
rect(-27,25,54,17,'#8e542e');rect(-24,29,48,4,'#c18a4b');rect(-21,43,10,10,'#2b3025');rect(12,43,10,10,'#2b3025');rect(-18,41,5,5,'#b2a17a');rect(15,41,5,5,'#b2a17a');
// body
rect(-13,1,26,27,'#1d633e');rect(-16,9,32,12,'#1d633e');rect(-10,3,20,9,'#ed8e38');rect(-13,22,10,8,'#76502f');rect(4,22,10,8,'#76502f');
// ears
rect(-24,-24,9,12,'#e8a56d');rect(15,-24,9,12,'#e8a56d');rect(-22,-22,5,7,'#b96b50');rect(17,-22,5,7,'#b96b50');
// face
rect(-16,-31,32,31,'#efb77e');rect(-13,-34,26,7,'#a95c35');rect(-9,-25,6,8,'#fff4d5');rect(4,-25,6,8,'#fff4d5');rect(-7,-23,3,4,'#222');rect(6,-23,3,4,'#222');rect(-5,-12,10,7,'#8c392a');rect(-4,-11,3,4,'#fff');rect(1,-11,3,4,'#fff');
// hair and hat
rect(-18,-39,36,8,'#874728');rect(-18,-43,10,8,'#874728');rect(-13,-49,26,11,'#1b5736');rect(-9,-56,23,10,'#287246');rect(2,-55,5,5,'#f4c34f');rect(-22,-39,44,4,'#123e2a');
// arms swing
rect(-23,5+(jump? -5:Math.sin(t*.02)*3),9,14,'#1b633c');rect(14,5-(jump? -4:Math.sin(t*.02)*3),9,14,'#1b633c');ctx.restore();if(jump>0)rect(x-18,H*.79,36,3,'#ffffff44')}
function drawObstacle(o){let x=W*(.25+.25*o.lane),y=o.y,sc=.45+y/H*.7;ctx.save();ctx.translate(x,y);if(o.type==='barrier'){rect(-28,-5,56,12,'#784629');for(let i=0;i<4;i++)rect(-23+i*14,-4,7,10,'#f4d9a1');rect(-24,7,6,22,'#6e432b');rect(18,7,6,22,'#6e432b')}else if(o.type==='bridge'){rect(-34,-26,68,15,'#627b66');rect(-28,-20,56,9,'#9cb18a');rect(-33,-10,9,35,'#536c5a');rect(24,-10,9,35,'#536c5a');rect(-17,-13,34,10,'#83d5ed')}else if(o.type==='sheep'){rect(-22,-17,44,29,'#fff1d6');rect(-18,-22,14,12,'#fff1d6');rect(4,-21,14,12,'#fff1d6');rect(17,-7,13,15,'#382c26');rect(20,-4,3,3,'#fff');rect(-14,11,5,13,'#41332b');rect(9,11,5,13,'#41332b')}else if(o.type==='rock'){rect(-23,-12,45,27,'#727d78');rect(-15,-21,24,12,'#8c9890');rect(-20,3,35,7,'#535f59')}else if(o.type==='log'){rect(-32,-9,64,18,'#8a542e');rect(-29,-7,8,14,'#c18a4b');rect(21,-7,8,14,'#c18a4b')}else if(o.type==='train'){rect(-28,-28,56,55,'#243c31');rect(-22,-21,44,24,'#d84631');rect(-18,-17,10,10,'#b9e7e8');rect(4,-17,10,10,'#b9e7e8');rect(-15,4,30,8,'#1d2520');rect(-22,15,44,7,'#171e19');rect(-17,-37,34,10,'#292f28');rect(-8,-49,16,13,'#2b332d');rect(-7,-59,14,9,'#f2e5b9');rect(-20,25,9,8,'#1d2520');rect(11,25,9,8,'#1d2520');if(Math.random()<.02)particles.push({x:x+rnd(-10,10),y:y-60,vx:rnd(-10,10),vy:-30,life:.7,c:'#fff0c9'})}ctx.restore()}
function draw(t){ctx.clearRect(0,0,W,H);drawBg(t);if(state==='title'){drawHero(t);text('READY, ARE YA?',W/2,H*.88,10);return}for(const o of obstacles)drawObstacle(o);drawHero(t);for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);rect(p.x,p.y,4,4,p.c);ctx.globalAlpha=1}if(state==='crash'){rect(0,0,W,H,'#10251b44');text('AH, GOBSHITE!',W/2,H*.28,14,'#ff9b42')}if(state==='pause'){rect(0,0,W,H,'#10251b66')}}
function update(dt,t){if(state==='run'){elapsed+=dt;speed=Math.min(390,205+elapsed*3.5);distance+=speed*dt*.055;scoreEl.textContent=Math.floor(distance);spawnIn-=dt;if(spawnIn<=0){spawn();spawnIn=Math.max(.58,1.15-elapsed*.008)+Math.random()*.35}jump=Math.max(0,jump-dt);duck=Math.max(0,duck-dt);for(const o of obstacles){o.y+=speed*dt*(.8+o.y/H*.35);if(!o.done&&o.y>H*.68&&o.y<H*.84){if(o.lane===lane){let safe=(o.type==='barrier'||o.type==='rock'||o.type==='log')?jump>0:(o.type==='bridge'?duck>0:false);if(o.type==='sheep'||o.type==='train')safe=false;if(!safe)crash(o);else{o.done=true;nearMissAt=t;beep(720,.05)}}else if(!o.passed&&o.y>H*.8){o.passed=true;if(Math.abs(o.lane-lane)===1&&Math.random()<.2){beep(760,.04)}}}if(o.y>H+70)o.remove=true}obstacles=obstacles.filter(o=>!o.remove)}for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);if(shake>0)shake=Math.max(0,shake-30*dt)}
function loop(t){let dt=Math.min(.035,(t-last)/1000||0);last=t;update(dt,t);if(shake>0){ctx.save();ctx.translate(rnd(-shake,shake),rnd(-shake,shake))}draw(t);if(shake>0)ctx.restore();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script></body></html>
