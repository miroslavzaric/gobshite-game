<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#124436">
<title>GOBSHITE! — The Runaway Railway</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
:root{--green:#124436;--lime:#8ddf35;--orange:#f47735;--cream:#fff0c9}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102b20;color:var(--cream);font-family:'Press Start 2P',monospace;touch-action:none}
#wrap{position:relative;width:100%;height:100%;display:flex;justify-content:center;background:#183e31}
canvas{display:block;width:100%;height:100%;max-width:600px;image-rendering:pixelated}
#hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:0;right:0;display:none;justify-content:space-between;padding:0 14px;font-size:9px;text-shadow:2px 2px #10251b;pointer-events:none}
button{font:inherit;border:3px solid #10251b;border-radius:8px;color:#14251c;background:var(--lime);box-shadow:0 5px 0 #0a1a12;padding:13px 12px;font-size:11px;cursor:pointer}
#hud button{pointer-events:auto;padding:9px}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(#071a1255,#071a12bb)}
.panel{width:min(100%,410px);border:4px solid #15271d;background:#f7e6b7;color:#14251c;box-shadow:0 0 0 4px #e0a24e,8px 8px 0 #071a12;padding:20px 16px;text-align:center}
.logo{font-size:clamp(28px,8vw,46px);line-height:1.25;letter-spacing:-3px;color:#8ddf35;text-shadow:3px 3px #174d35,6px 6px #10251b}.logo span{color:#f47735}
.tag{font-size:8px;line-height:2.1;margin:12px auto;color:#33513c}
.hero{height:145px;margin:6px auto 10px;display:flex;align-items:center;justify-content:center}
.actions{display:grid;gap:10px;margin-top:12px}.sound{background:#e9d5a2}
.small{font-size:7px;line-height:2;margin-top:12px;color:#425543}
.hidden{display:none!important}.speech{font-size:10px;line-height:1.8;margin:14px 0}.stats{font-size:8px;line-height:2.4}
.hint{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:7px;color:#fff0c9cc;pointer-events:none}
@media(min-aspect-ratio:3/4){.panel{padding:13px;max-width:360px}.hero{height:110px}.tag{margin:7px}.small{margin-top:8px}}
</style>
</head>
<body><main id="wrap"><canvas id="game"></canvas>
<div id="hud"><div>DISTANCE <span id="score">0</span>m<br><span style="color:#8ddf35">BEST <span id="best">0</span>m</span></div><button id="pauseBtn">Ⅱ</button></div>
<div id="overlay"><section class="panel" id="panel"></section></div><div class="hint" id="hint">SWIPE TO DODGE · TAP TO START</div></main>
<script>
(()=>{
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay'),panel=document.querySelector('#panel'),hud=document.querySelector('#hud'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),hint=document.querySelector('#hint');
let W=390,H=844,dpr=1,state='title',last=0,elapsed=0,distance=0,best=+(localStorage.getItem('gobshite-best')||0),speed=205,lane=1,jump=0,duck=0,obstacles=[],spawnIn=1, sound=false,audio=null,dialogue='',shake=0;
bestEl.textContent=best;
function resize(){dpr=Math.min(devicePixelRatio||1,2);const r=canvas.getBoundingClientRect();W=Math.max(300,r.width);H=Math.max(500,r.height);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(resize).observe(canvas);resize();
function beep(f=300,d=.08,type='square'){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.value=.03;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch{}}
const rand=(a,b)=>a+Math.random()*(b-a);
function leprechaun(x,y,s=1,fall=false){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 // boots and legs
 rect(-17,22,13,18,'#68452e');rect(5,22,13,18,'#68452e');rect(-21,36,17,7,'#302820');rect(3,36,18,7,'#302820');
 // green coat, orange waistcoat
 rect(-20,-2,40,30,'#17603e');rect(-10,2,20,22,'#d9672d');rect(-3,5,6,5,'#f4c34f');rect(-3,14,6,5,'#f4c34f');
 // ears
 rect(-29,-27,12,15,'#f3b17d');rect(17,-27,12,15,'#f3b17d');rect(-25,-24,6,8,'#c86b52');rect(19,-24,6,8,'#c86b52');
 // face, freckles, eyes, nose, teeth
 rect(-19,-36,38,38,'#f5c18a');rect(-14,-30,7,9,'#fff8df');rect(7,-30,7,9,'#fff8df');rect(-11,-28,4,6,'#263329');rect(9,-28,4,6,'#263329');rect(-4,-20,10,8,'#ef9c61');rect(-3,-10,14,6,'#7d3027');rect(-1,-9,5,4,'#fff8df');rect(5,-9,5,4,'#fff8df');
 for(let i=0;i<6;i++)rect(-13+(i%3)*7,-18+Math.floor(i/3)*5,2,2,'#b95f45');
 // bright auburn hair and beard
 rect(-22,-41,44,10,'#b84f25');rect(-23,-34,10,13,'#d85d26');rect(13,-34,10,13,'#d85d26');rect(-19,-12,38,18,'#d85d26');rect(-14,0,28,7,'#b84f25');rect(-12,-6,6,7,'#ed7830');rect(4,-6,6,7,'#ed7830');
 // green hat and gold buckle
 rect(-26,-48,52,8,'#124436');rect(-18,-62,36,17,'#17603e');rect(-10,-68,20,8,'#28794a');rect(-2,-59,10,7,'#f4c34f');rect(0,-58,5,4,'#d18b24');rect(-27,-49,54,4,'#0a3025');
 // shamrock badge
 rect(14,-57,5,5,'#8ddf35');rect(19,-60,5,5,'#8ddf35');rect(19,-54,5,5,'#8ddf35');
 ctx.restore()
}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function title(){state='title';hud.style.display='none';hint.textContent='SWIPE TO DODGE · TAP TO START';panel.innerHTML=`<div class="logo">GOB<span>SHITE!</span></div><div class="hero"><canvas id="portrait" width="170" height="145" style="width:170px;height:145px;image-rendering:pixelated"></canvas></div><div class="tag">THE RUNAWAY RAILWAY<br>ONE TINY IRISH TROUBLEMAKER.<br>YOUR FAULT, APPARENTLY.</div><div style="font-size:7px;line-height:2">← → CHANGE LANE<br>↑ JUMP · ↓ DUCK</div><div class="actions"><button id="playBtn">▶ PLAY</button><button class="sound" id="soundBtn">♫ SOUND: ${sound?'ON':'OFF'}</button></div><div class="small">BEST DISTANCE: ${best}m<br>NO MERCY. JUST ONE MORE GO.</div>`;let p=document.querySelector('#portrait'),c=p.getContext('2d');c.imageSmoothingEnabled=false;c.save();c.translate(85,85); // reuse stylised pixel character in portrait canvas
 c.scale(1.35,1.35); c.fillStyle='#17603e';c.fillRect(-18,-5,36,35);c.fillStyle='#d9672d';c.fillRect(-9,0,18,22);c.fillStyle='#f5c18a';c.fillRect(-19,-40,38,39);c.fillStyle='#f5c18a';c.fillRect(-29,-28,12,14);c.fillRect(17,-28,12,14);c.fillStyle='#d85d26';c.fillRect(-21,-42,42,13);c.fillRect(-18,-13,36,23);c.fillStyle='#fff8df';c.fillRect(-12,-30,8,10);c.fillRect(5,-30,8,10);c.fillStyle='#263329';c.fillRect(-8,-27,4,6);c.fillRect(8,-27,4,6);c.fillStyle='#7d3027';c.fillRect(-4,-10,16,6);c.fillStyle='#fff8df';c.fillRect(-1,-9,6,4);c.fillRect(6,-9,6,4);c.fillStyle='#124436';c.fillRect(-27,-50,54,8);c.fillRect(-18,-64,36,18);c.fillStyle='#28794a';c.fillRect(-10,-70,20,8);c.fillStyle='#f4c34f';c.fillRect(0,-59,10,7);c.restore();
 document.querySelector('#playBtn').onclick=start;document.querySelector('#soundBtn').onclick=toggleSound;overlay.classList.remove('hidden')}
const taunts={barrier:['Were you looking at the scenery, ya gobshite?','That barrier had the right of way. And more brains.'],sheep:['You couldnt avoid a sheep? A SHEEP!','He has more sense than you, that sheep.'],bridge:['Mind the head? What head?','A grand day to become a pancake.'],train:['Next time, try NOT meeting the train.','I specifically ordered the small train.'],rock:['Rock. You see rock. You hit rock. Jaysus.'],log:['Timber! No, wait. That was you.']};
function start(){state='run';elapsed=distance=0;speed=205;lane=1;jump=duck=0;obstacles=[];spawnIn=.8;overlay.classList.add('hidden');hud.style.display='flex';hint.textContent='';last=performance.now();beep(540)}
function toggleSound(){sound=!sound;let b=document.querySelector('#soundBtn');if(b)b.textContent='♫ SOUND: '+(sound?'ON':'OFF');beep(440)}
function spawn(){let r=Math.random(),type=elapsed>18&&r<.08?'train':r<.22?'sheep':r<.38?'barrier':r<.53?'bridge':r<.72?'rock':'log',ln=Math.floor(Math.random()*3);obstacles.push({type,lane:ln,p:0,done:false})}
function crash(o){if(state!=='run')return;state='crash';let arr=taunts[o.type]||taunts.barrier;dialogue=arr[Math.floor(Math.random()*arr.length)];if(distance>best){best=Math.floor(distance);localStorage.setItem('gobshite-best',best)}setTimeout(()=>{if(state==='crash')gameOver()},500)}
function gameOver(){overlay.classList.remove('hidden');panel.innerHTML=`<div class="logo">AH, <span>GOBSHITE!</span></div><div class="speech">“${dialogue}”</div><div class="stats">DISTANCE: ${Math.floor(distance)}m<br>BEST: ${best}m</div><div class="actions"><button id="again">↻ TRY AGAIN</button><button class="sound" id="home">TITLE SCREEN</button></div>`;document.querySelector('#again').onclick=start;document.querySelector('#home').onclick=title}
function pause(){if(state==='run'){state='pause';panel.innerHTML=`<div class="logo">TAKE A <span>BREATHER</span></div><div class="actions"><button id="resume">RESUME</button><button class="sound" id="restart">RESTART RUN</button><button class="sound" id="home">TITLE SCREEN</button></div>`;overlay.classList.remove('hidden');document.querySelector('#resume').onclick=()=>{state='run';overlay.classList.add('hidden');last=performance.now()};document.querySelector('#restart').onclick=start;document.querySelector('#home').onclick=title}}
document.querySelector('#pauseBtn').onclick=pause;
function move(a){if(state!=='run')return;if(a==='left')lane=Math.max(0,lane-1);if(a==='right')lane=Math.min(2,lane+1);if(a==='jump'&&!jump&&!duck)jump=.65;if(a==='duck'&&!jump)duck=.6}
let sx=0,sy=0;canvas.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});canvas.addEventListener('pointerup',e=>{let dx=e.clientX-sx,dy=e.clientY-sy;if(state==='title'){start();return}if(state!=='run'||Math.max(Math.abs(dx),Math.abs(dy))<18)return;if(Math.abs(dx)>Math.abs(dy))move(dx<0?'left':'right');else move(dy<0?'jump':'duck')});
window.addEventListener('keydown',e=>{if(state==='title'&&(e.key===' '||e.key==='Enter'))start();else if(e.key==='ArrowLeft'||e.key==='a')move('left');else if(e.key==='ArrowRight'||e.key==='d')move('right');else if(e.key==='ArrowUp'||e.key==='w')move('jump');else if(e.key==='ArrowDown'||e.key==='s')move('duck');else if(e.key==='Escape')pause()});
function trackGeometry(p){ // p=0 horizon, p=1 foreground; track edges converge to vanishing point
 const y=H*(.34+p*p*.66), half=W*(.10+p*.50);return {y,left:W/2-half,right:W/2+half,half}}
function drawTrack(t){
 // countryside sky
 rect(0,0,W,H,'#78c9e8');rect(0,H*.28,W,H*.24,'#4b9b64');
 ctx.fillStyle='#8acb5a';ctx.beginPath();ctx.moveTo(0,H*.36);for(let x=0;x<=W;x+=8)ctx.lineTo(x,H*.28+Math.sin(x*.018+t*.0002)*18);ctx.lineTo(W,H*.62);ctx.lineTo(0,H*.62);ctx.fill();
 // distant castle
 rect(W*.73,H*.20,22,36,'#a5a58b');rect(W*.77,H*.16,10,22,'#8b907c');rect(W*.70,H*.24,9,29,'#9b9d87');
 // gravel track bed
 ctx.fillStyle='#776b57';ctx.beginPath();ctx.moveTo(W*.42,H*.34);ctx.lineTo(W*.58,H*.34);ctx.lineTo(W*1.12,H);ctx.lineTo(-W*.12,H);ctx.closePath();ctx.fill();
 // ballast stones in track bed
 for(let i=0;i<180;i++){let p=((i/180+t*.00008)%1),g=trackGeometry(p);let x=W/2+rand(-g.half*.87,g.half*.87);rect(x,g.y,Math.max(1,p*3),Math.max(1,p*2),i%3?'#9a8b70':'#514d43')}
 // real steel rails: dark web, steel body, bright inner highlight; sleepers cross beneath both rails
 for(let i=0;i<25;i++){let p=((i/25+t*.00023)%1),g=trackGeometry(p),th=2+p*5,sl=g.half*.88;ctx.fillStyle='#523c2b';ctx.beginPath();ctx.moveTo(W/2-sl,g.y);ctx.lineTo(W/2+sl,g.y);ctx.lineWidth=2+p*11;ctx.strokeStyle='#65432c';ctx.beginPath();ctx.moveTo(W/2-sl,g.y);ctx.lineTo(W/2+sl,g.y);ctx.stroke();ctx.strokeStyle='#a9774c';ctx.lineWidth=1+p*6;ctx.beginPath();ctx.moveTo(W/2-sl,g.y-1);ctx.lineTo(W/2+sl,g.y-1);ctx.stroke()}
 for(let side of [-1,1]){ctx.beginPath();ctx.moveTo(W/2+side*W*.08,H*.34);ctx.lineTo(W/2+side*W*.60,H);ctx.lineWidth=8;ctx.strokeStyle='#333d3c';ctx.stroke();ctx.beginPath();ctx.moveTo(W/2+side*W*.08,H*.34);ctx.lineTo(W/2+side*W*.60,H);ctx.lineWidth=5;ctx.strokeStyle='#9da9a6';ctx.stroke();ctx.beginPath();ctx.moveTo(W/2+side*W*.08,H*.34);ctx.lineTo(W/2+side*W*.60,H);ctx.lineWidth=1.5;ctx.strokeStyle='#f2ead2';ctx.stroke()}
 // sleepers are redrawn on top of rails so they visibly pass underneath
 for(let i=0;i<19;i++){let p=((i/19+t*.00023)%1),g=trackGeometry(p),half=g.half*.91,th=2+p*10;ctx.strokeStyle='#3e2c23';ctx.lineWidth=th+2;ctx.beginPath();ctx.moveTo(W/2-half,g.y);ctx.lineTo(W/2+half,g.y);ctx.stroke();ctx.strokeStyle='#8c5734';ctx.lineWidth=th;ctx.beginPath();ctx.moveTo(W/2-half,g.y);ctx.lineTo(W/2+half,g.y);ctx.stroke();ctx.strokeStyle='#c28b53';ctx.lineWidth=Math.max(1,th*.18);ctx.beginPath();ctx.moveTo(W/2-half,g.y-th*.3);ctx.lineTo(W/2+half,g.y-th*.3);ctx.stroke();
 // rail fasteners where sleeper meets rail
 for(let side of [-1,1]){let x=W/2+side*g.half*.5;rect(x-th*.5,g.y-th*.45,Math.max(2,th*.38),Math.max(2,th*.35),'#343b39')}
 }
 // stone walls and flowers
 for(let i=0;i<14;i++){let p=((i/14+t*.00013)%1),g=trackGeometry(p),y=g.y,sz=.5+p;rect(W*.02,y,16*sz,5*sz,'#778675');rect(W*.93-16*sz,y,16*sz,5*sz,'#778675');if(i%3===0){rect(W*.1,y-4*sz,3*sz,3*sz,'#ffcc68');rect(W*.87,y-3*sz,3*sz,3*sz,'#f4a6a2')}}
}
function lanePos(ln,p){let g=trackGeometry(p);return W/2+(ln-1)*g.half*.48}
function drawObstacle(o){let p=o.p,g=trackGeometry(p),x=lanePos(o.lane,p),y=g.y,sc=.35+p*.8;ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);
 // Draw grounded objects on the track surface. Their bottom edge sits at sleeper level.
 if(o.type==='barrier'){rect(-31,-35,62,10,'#f1e4c8');for(let i=0;i<5;i++)rect(-29+i*13,-35,7,10,'#d84531');rect(-29,-25,6,25,'#5c402b');rect(23,-25,6,25,'#5c402b');rect(-34,-39,68,5,'#9ca5a0')}
 else if(o.type==='bridge'){rect(-40,-54,80,12,'#536b50');rect(-35,-48,70,8,'#8da37b');rect(-38,-40,9,40,'#536b50');rect(29,-40,9,40,'#536b50');rect(-18,-42,36,9,'#78c9e8')}
 else if(o.type==='sheep'){rect(-23,-34,46,27,'#fff1d6');rect(-19,-40,15,13,'#fff1d6');rect(3,-40,15,13,'#fff1d6');rect(16,-31,13,17,'#382c26');rect(20,-27,3,3,'#fff');rect(-14,-7,5,7,'#41332b');rect(9,-7,5,7,'#41332b')}
 else if(o.type==='rock'){rect(-24,-28,45,26,'#727d78');rect(-15,-39,24,14,'#8c9890');rect(-20,-5,35,5,'#535f59')}
 else if(o.type==='log'){rect(-35,-24,70,22,'#8a542e');rect(-32,-22,9,18,'#c18a4b');rect(23,-22,9,18,'#c18a4b');rect(-17,-20,3,14,'#5d371f');rect(8,-20,3,14,'#5d371f')}
 else if(o.type==='train'){rect(-29,-57,58,56,'#263c32');rect(-23,-50,46,25,'#d84631');rect(-18,-45,11,11,'#b9e7e8');rect(5,-45,11,11,'#b9e7e8');rect(-15,-22,30,8,'#1d2520');rect(-24,-9,48,7,'#171e19');rect(-20,-1,10,5,'#1d2520');rect(10,-1,10,5,'#1d2520');rect(-7,-68,14,12,'#2b332d');rect(-6,-78,12,10,'#f2e5b9')}
 ctx.restore()}
function draw(t){ctx.clearRect(0,0,W,H);drawTrack(t);if(state==='title'){leprechaun(W/2,H*.75,1.15);return} // far obstacles first, nearer obstacles last
 for(const o of [...obstacles].sort((a,b)=>a.p-b.p))drawObstacle(o);
 let py=H*.79-jump*H*.33;if(duck>0)py+=12;leprechaun(lanePos(lane,.82),py,Math.min(1.5,W/390)*(duck>0?.72:1),state==='crash');
 if(state==='crash'){rect(0,0,W,H,'#10251b44')}
}
function update(dt){if(state==='run'){elapsed+=dt;speed=Math.min(390,205+elapsed*3.5);distance+=speed*dt*.055;scoreEl.textContent=Math.floor(distance);spawnIn-=dt;if(spawnIn<=0){spawn();spawnIn=Math.max(.62,1.25-elapsed*.007)+Math.random()*.3}jump=Math.max(0,jump-dt);duck=Math.max(0,duck-dt);
 for(const o of obstacles){o.p+=speed*dt/(H*.9); // collision uses same projected position and the visible ground contact point
 if(!o.done&&o.p>.76&&o.p<.91&&o.lane===lane){let safe=(o.type==='barrier'||o.type==='rock'||o.type==='log')?jump>0:(o.type==='bridge'?duck>0:false);if(o.type==='sheep'||o.type==='train')safe=false;if(!safe)crash(o);else o.done=true}
 if(o.p>1.08)o.remove=true}obstacles=obstacles.filter(o=>!o.remove)}
}
function loop(t){let dt=Math.min(.035,(t-last)/1000||0);last=t;update(dt);draw(t);requestAnimationFrame(loop)}
title();last=performance.now();requestAnimationFrame(loop);
})();
</script></body></html>
